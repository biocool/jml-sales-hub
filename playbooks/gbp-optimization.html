<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>JML GBP Optimization Playbook</title><meta name="claude:viewport-fit-sides" content="cover"><style>
/* Layout: purple masthead, sticky phase rail, then one column where every phase leads with a diagram and keeps tasks to one line each. */
:root{
  --purple:#4C0099; --lime:#B1EB1E;
  --bg:#FFFFFF; --surface:#F7F5FA; --fg:#1A1A1A; --muted:#5B536B; --line:#E3DCEC;
  --heading:#4C0099; --chip:#EFEAF6; --stroke:#4C0099; --onpurple:#FFFFFF; --onlime:#1A1A1A;
  --good:#2E7D4F; --mid:#E3A21A; --bad:#B83227; --ongood:#FFFFFF; --onmid:#1A1A1A; --onbad:#FFFFFF;
  --display:"DM Serif Display",Georgia,serif;
  --body:"DM Sans",Arial,sans-serif;
  --mono:"JetBrains Mono","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130A20; --surface:#1D1230; --fg:#ECE7F3; --muted:#AFA4C2; --line:#33264B;
  --heading:#F2ECFA; --chip:#2A1C42; --stroke:#B1EB1E;
  --good:#3FA36A; --mid:#E8B23A; --bad:#D9584A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130A20; --surface:#1D1230; --fg:#ECE7F3; --muted:#AFA4C2; --line:#33264B;
  --heading:#F2ECFA; --chip:#2A1C42; --stroke:#B1EB1E;
  --good:#3FA36A; --mid:#E8B23A; --bad:#D9584A; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--purple)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--heading);text-wrap:balance;margin:0}
h4{font-size:.98rem;margin:0;font-weight:700}
p{margin:0 0 .5rem}
a{color:inherit}
.mono{font-family:var(--mono);overflow-wrap:anywhere}
.label{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}

/* Masthead */
.mast{background:var(--purple);color:var(--onpurple)}
.mast .wrap{padding-block:26px 30px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end}
.mast img{width:120px;display:block}
.mast h1{color:#FFFFFF;font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.05}
.mast .label{color:var(--lime);margin-bottom:.5rem}
.mast p{color:#E9E1F5;max-width:60ch;margin:.7rem 0 0}
@media (max-width:620px){.mast .wrap{grid-template-columns:1fr;gap:16px}.mast img{width:100px}}

/* Rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:12px;align-items:center;padding-block:9px;flex-wrap:wrap}
.phases{display:flex;gap:6px;overflow-x:auto;flex:1 1 420px;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.phases a{font-family:var(--mono);font-size:.72rem;text-decoration:none;padding:5px 8px;border-radius:4px;background:var(--chip);white-space:nowrap;color:var(--fg)}
.phases a:hover,.phases a:focus-visible{background:var(--purple);color:#fff;outline:none}
.filter{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.filter button{font:500 .78rem var(--body);background:transparent;color:var(--fg);border:0;padding:6px 10px;cursor:pointer}
.filter button+button{border-left:1px solid var(--line)}
.filter button[aria-pressed="true"]{background:var(--purple);color:#fff}
.filter button:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
.fnote{display:none;background:var(--lime);color:var(--onlime);font-size:.8rem;font-weight:500}
.fnote.on{display:block}
.fnote .wrap{padding-block:5px}

main{padding-block:8px 72px}
section{padding-top:52px;scroll-margin-top:84px}
.sechead{display:grid;grid-template-columns:64px 1fr;gap:2px 16px;align-items:baseline;margin-bottom:16px}
.sechead .num{font-family:var(--display);font-size:2.5rem;line-height:1;color:var(--purple)}
:root[data-theme="dark"] .sechead .num{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sechead .num{color:var(--lime)}}
.sechead h2{font-size:clamp(1.55rem,3.3vw,2rem)}
.sechead .meta{grid-column:2;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.sechead .meta span{font-family:var(--mono);font-size:.74rem}
@media (max-width:560px){.sechead{grid-template-columns:1fr}.sechead .meta{grid-column:1}}
.lede{max-width:66ch}
h3.sub{font-size:1.25rem;margin:26px 0 10px}

/* Figures */
figure{margin:14px 0 6px}
figcaption{font-size:.82rem;color:var(--muted);margin-top:6px;max-width:70ch}
.fig{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.fig svg{display:block;width:100%;height:auto}
.fig.wide svg{min-width:880px}
.fig.mid svg{min-width:620px}
svg text{font-family:var(--body);font-size:13px;fill:var(--fg)}
svg .tb{font-weight:700}
svg .ts{font-size:11px;fill:var(--muted)}
svg .tn{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.n-p rect,.n-p polygon{fill:var(--purple)}
.n-p text,.n-p .ts{fill:#FFFFFF}
.n-o rect{fill:var(--bg);stroke:var(--stroke);stroke-width:1.5}
.n-o.dash rect{stroke-dasharray:6 4}
.n-l rect,.n-l polygon{fill:var(--lime)}
.n-l text,.n-l .ts{fill:#1A1A1A}
.n-g path{fill:var(--bg);stroke:var(--stroke);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.lp{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.gd circle{stroke:none}
.gd.g circle{fill:var(--good)} .gd.g text{fill:var(--ongood)}
.gd.m circle{fill:var(--mid)} .gd.m text{fill:var(--onmid)}
.gd.b circle{fill:var(--bad)} .gd.b text{fill:var(--onbad)}
.gd text{font-family:var(--mono);font-size:11px;font-weight:500}
.office{fill:none;stroke:var(--fg);stroke-width:2.5}
.gl{font-family:var(--mono);font-size:11px;fill:var(--muted)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:30px;height:13px;border-radius:3px}
.sw.p{background:var(--purple)} .sw.o{border:1.5px solid var(--stroke)} .sw.l{background:var(--lime)} .sw.d{border:1.5px dashed var(--stroke)}
.sw.gt{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--stroke);margin:0 6px}
.dotg{background:var(--good)} .dotm{background:var(--mid)} .dotb{background:var(--bad)}
.sw.c{width:12px;height:12px;border-radius:50%}

/* Gantt */
.gantt{display:grid;grid-template-columns:150px repeat(8,minmax(40px,1fr));min-width:600px;font-size:.8rem}
.gantt .h{font-family:var(--mono);font-size:.66rem;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.gantt .h:first-child{text-align:left}
.gantt .r{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.gantt .c{border-bottom:1px solid var(--line);border-left:1px solid var(--line);position:relative;min-height:26px}
.bar{position:absolute;top:7px;bottom:7px;left:2px;right:2px;border-radius:3px;background:var(--purple)}
.bar.l{background:var(--lime)}
.bar.o{background:transparent;border:1.5px dashed var(--stroke)}
.bar.fade{-webkit-mask:linear-gradient(90deg,#000 50%,transparent);mask:linear-gradient(90deg,#000 50%,transparent)}
.dia{position:absolute;top:50%;left:50%;width:11px;height:11px;margin:-6px 0 0 -6px;background:var(--lime);transform:rotate(45deg);outline:1px solid var(--stroke)}

/* Who matrix */
.who{border-collapse:collapse;width:100%;min-width:560px;font-size:.84rem}
.who th{font-family:var(--mono);font-weight:500;font-size:.68rem;color:var(--muted);padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.who th:first-child,.who td:first-child{text-align:left;white-space:nowrap;padding-right:12px}
.who td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.who td small{display:block;font-size:.72rem;color:var(--muted)}
.dl{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--purple)}
:root[data-theme="dark"] .dl{background:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dl{background:var(--lime)}}
.dh{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--stroke)}

/* Generic grids */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2>*,.grid3>*{min-width:0}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.box.soft{background:var(--surface)}
.box h4{margin-bottom:6px}
.box ul{margin:0;padding-left:1.05rem;font-size:.88rem}
.box li{margin:.15rem 0}
.boxtitle{font-family:var(--display);font-size:1.15rem;color:var(--heading);margin-bottom:6px}

/* Timeline of changes */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:12px}
.tl>div{border-top:2px solid var(--stroke);padding:14px 14px 0 0;position:relative;min-width:0}
.tl>div::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--stroke)}
.tl .d{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.tl b{display:block;margin:2px 0 4px}
.tl p{font-size:.86rem;margin:0}
.tl .so{font-size:.82rem;color:var(--muted);margin-top:6px}
@media (max-width:760px){.tl{grid-template-columns:1fr}.tl>div{border-top:0;border-left:2px solid var(--stroke);padding:0 0 16px 16px}.tl>div::before{top:2px;left:-7px}}

/* Decision tree */
.tree{margin:12px 0;border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--surface)}
.tq{display:inline-block;background:var(--purple);color:#fff;font-weight:700;font-size:.9rem;padding:7px 12px;border-radius:5px}
.tq .label{color:var(--lime);margin-right:8px}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:22px;position:relative}
.tops::before{content:"";position:absolute;left:18px;top:-22px;height:12px;border-left:1.5px solid var(--muted)}
.tops::after{content:"";position:absolute;left:18px;right:18px;top:-10px;border-top:1.5px solid var(--muted)}
.to{background:var(--bg);border:1.5px solid var(--stroke);border-radius:5px;padding:9px 11px;font-size:.84rem;position:relative;min-width:0}
.to::before{content:"";position:absolute;left:18px;top:-11px;height:10px;border-left:1.5px solid var(--muted)}
.to>b{display:block;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--heading);margin-bottom:2px}
.to.warn{border-style:dashed}
.to.go{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
.to.go>b{color:var(--onlime)}
@media (max-width:560px){.tops::after{display:none}.tops::before{height:22px}.to::before{display:none}.tops{gap:8px}}

/* Sorter */
.sorter{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:12px 0}
.srow{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow>div:first-child{background:var(--surface);padding:10px 12px;font-weight:700;font-size:.88rem}
.sopts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;min-width:0}
.so{border:1.5px solid var(--stroke);border-radius:5px;padding:6px 9px;font-size:.8rem;flex:1 1 150px;min-width:0}
.so b{display:block;font-size:.84rem}
@media (max-width:620px){.srow{grid-template-columns:1fr}}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;background:var(--chip);border-radius:4px;padding:4px 8px}
.chip.l{background:var(--lime);color:var(--onlime)}
.pill{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--chip);color:var(--heading);white-space:nowrap}

/* Tasks */
.tasks{border-top:1px solid var(--line);margin-top:14px}
.task{display:grid;grid-template-columns:52px minmax(0,1fr) 220px;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.tid{font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-top:2px}
.task p{margin:2px 0 0;font-size:.88rem;color:var(--fg)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.76rem;color:var(--muted)}
.own{font-family:var(--mono);font-size:.7rem;background:var(--chip);color:var(--fg);padding:2px 6px;border-radius:3px}
@media (max-width:700px){.task{grid-template-columns:40px minmax(0,1fr)}.tmeta{grid-column:2}}

/* Gate */
.gate{background:var(--purple);color:#fff;border-radius:6px;padding:14px 16px;margin:20px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.gate .label{color:var(--lime);padding-top:3px}
.gate h4{color:#fff}
.gate ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.gate li{font-size:.82rem;background:rgba(255,255,255,.12);border-radius:4px;padding:4px 8px}
.gate li::before{content:"âœ“ ";color:var(--lime);font-weight:700}
.gate p{grid-column:2;margin:6px 0 0;font-size:.84rem;color:#E9E1F5}
@media (max-width:560px){.gate{grid-template-columns:1fr}.gate p{grid-column:1}}

/* Film strip */
.film{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;margin:10px 0}
.frame{border:1.5px solid var(--stroke);border-radius:6px;padding:10px 12px;background:var(--bg);font-size:.84rem;min-width:0}
.frame .n{font-family:var(--display);font-size:1.6rem;color:var(--heading);line-height:1}
.frame b{display:block;margin:4px 0 2px}
.filmcap{font-family:var(--mono);font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:4px}
.filmcap::before{content:"";flex:1;border-top:1.5px dashed var(--muted)}
.filmcap::after{content:"â–¶";color:var(--muted)}
@media (max-width:620px){.film{grid-template-columns:1fr}}

/* Roles */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.role{border-radius:6px;padding:10px 12px;font-size:.84rem;min-width:0}
.role.a{background:var(--purple);color:#fff}
.role.b{border:1.5px solid var(--stroke)}
.role.c{background:var(--lime);color:var(--onlime)}
.role .k{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.role b{display:block;font-size:1rem;margin:2px 0}
@media (max-width:620px){.roles{grid-template-columns:1fr}}

.perm{border-collapse:collapse;width:100%;min-width:480px;font-size:.84rem}
.perm th{font-family:var(--mono);font-weight:500;font-size:.68rem;color:var(--muted);text-align:center;padding:7px 8px;border-bottom:1px solid var(--line)}
.perm th:first-child,.perm td:first-child{text-align:left}
.perm td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.perm td.y{color:var(--good);font-weight:700}
.perm td.n{color:var(--bad);font-weight:700}
.tmeta::before{content:"Done when:";font-weight:700;color:var(--fg)}
/* URL anatomy */
.url{display:flex;flex-wrap:wrap;font-family:var(--mono);font-size:.8rem;margin:10px 0;row-gap:6px}
.seg{display:flex;flex-direction:column;min-width:0}
.seg code{padding:5px 4px;background:var(--chip);border-bottom:3px solid var(--line);overflow-wrap:anywhere}
.seg.k code{border-bottom-color:var(--stroke)}
.seg small{font-family:var(--body);font-size:.7rem;color:var(--muted);padding:3px 4px 0}

/* Metric tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--display);font-size:1.7rem;color:var(--heading);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .t{font-size:.82rem}
.tile .s{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tile.g .s{color:var(--heading)}

/* Audit cards */
.cards5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.cards5>div{border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0;font-size:.8rem;display:flex;flex-direction:column;gap:6px}
.cards5 .id{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.cards5 b{font-size:.9rem}
.cards5 ul{margin:0;padding-left:1rem}
.cards5 .out{margin-top:auto;font-family:var(--mono);font-size:.68rem;background:var(--chip);border-radius:3px;padding:3px 6px}
@media (max-width:900px){.cards5{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.cards5{grid-template-columns:1fr}}

/* Priority ladder */
.ladder{display:grid;gap:5px;margin:10px 0}
.rung{display:flex;align-items:center;gap:10px;font-size:.84rem}
.rung span.b{background:var(--purple);color:#fff;border-radius:4px;padding:5px 10px;font-weight:500;min-width:0}
.rung .n{font-family:var(--mono);font-size:.74rem;color:var(--muted);width:16px;text-align:right}

/* Anatomy */
.anat{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start;margin:12px 0}
.anat>*{min-width:0}
@media (max-width:760px){.anat{grid-template-columns:1fr}}
.wire{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);font-size:.78rem}
.wire .ph{height:96px;background:repeating-linear-gradient(45deg,var(--chip) 0 10px,var(--surface) 10px 20px);position:relative}
.wire .row{padding:7px 12px;border-top:1px solid var(--line);position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wire .nm{font-weight:700;font-size:1rem}
.wire .btns{display:flex;gap:5px;flex-wrap:wrap}
.wire .btns span{border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:.72rem}
.wire .bar2{height:7px;border-radius:3px;background:var(--line);flex:1}
.mk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--lime);color:var(--onlime);font-family:var(--mono);font-size:.68rem;font-weight:500;flex:none}
.wire .ph .mk{position:absolute;top:8px;left:8px}
.fields{display:grid;gap:0;border-top:1px solid var(--line)}
.fields>div{display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.84rem;align-items:start}
.fields b{font-size:.86rem}
@media (max-width:480px){.fields>div{grid-template-columns:22px 1fr}.fields>div>span:last-child{grid-column:2}}

/* Do / don't */
.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.dd>div{border-radius:6px;padding:12px 14px;min-width:0}
.dd .do{border:1.5px solid var(--good)}
.dd .dont{border:1.5px solid var(--bad)}
.dd h4{margin-bottom:6px}
.dd ul{list-style:none;margin:0;padding:0;font-size:.86rem;display:grid;gap:4px}
.dd .do li::before{content:"âœ“ ";color:var(--good);font-weight:700}
.dd .dont li::before{content:"âœ• ";color:var(--bad);font-weight:700}
@media (max-width:620px){.dd{grid-template-columns:1fr}}
.tpl{font-family:var(--mono);font-size:.78rem;background:var(--surface);border:1px dashed var(--muted);border-radius:6px;padding:9px 12px;margin:8px 0;overflow-wrap:anywhere}

/* Rhythm */
.rhythm{display:grid;gap:8px;margin:10px 0}
.rh{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}
.rh .k{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-radius:4px;text-align:center}
.rh.w .k{background:var(--purple);color:#fff}
.rh.m .k{background:var(--chip);color:var(--heading)}
.rh.q .k{border:1.5px solid var(--stroke);color:var(--heading)}
.rh .chips{margin:0}
@media (max-width:520px){.rh{grid-template-columns:1fr}}

/* Incidents */
.inc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.inc>div{border:1.5px dashed var(--stroke);border-radius:6px;padding:10px 12px;font-size:.82rem;min-width:0;display:grid;gap:4px}
.inc b{font-size:.92rem}
.inc .k{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inc .sp{font-family:var(--mono);font-size:.7rem;background:var(--chip);padding:2px 6px;border-radius:3px;justify-self:start}

/* Steps */
.steps{display:flex;flex-wrap:wrap;gap:8px 0;margin:12px 0;align-items:stretch}
.step{display:flex;align-items:center}
.step>div{border:1.5px solid var(--stroke);border-radius:5px;padding:7px 10px;font-size:.8rem;max-width:150px}
.step>div b{display:block;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.step.hot>div{background:var(--purple);color:#fff;border-color:var(--purple)}
.step.hot>div b{color:var(--lime)}
.step.alt>div{border-style:dashed}
.step+.step::before{content:"â†’";color:var(--muted);padding:0 6px}

/* Map signal list */
.sig{display:grid;gap:6px;margin:10px 0}
.sig>div{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:8px;font-size:.86rem}
.sig .a{background:var(--surface);border-radius:4px;padding:6px 10px}
.sig .z{color:var(--muted);text-align:center}
.sig .s{border:1.5px solid var(--stroke);border-radius:4px;padding:6px 10px;font-weight:500}
@media (max-width:520px){.sig>div{grid-template-columns:1fr}.sig .z{display:none}}

/* Never */
.never{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-top:10px}
.never>div{display:grid;grid-template-columns:22px 1fr;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:.84rem;min-width:0}
.never .x{color:var(--bad);font-weight:700;font-size:1rem;line-height:1.2}
.never b{display:block;font-size:.9rem}

.src{font-size:.8rem;color:var(--muted);margin:10px 0 0;padding-left:1.1rem}
.src li{margin:.15rem 0}
footer{border-top:1px solid var(--line);margin-top:48px;padding-block:18px;color:var(--muted);font-size:.82rem}
.off{display:none !important}
@media (prefers-reduced-motion:no-preference){.phases a,.filter button{transition:background .15s,color .15s}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
